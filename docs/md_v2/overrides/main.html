{% set extra_html_attrs = 'data-theme="dark"' %}
{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<script>
    document.documentElement.setAttribute("data-theme", "dark");
</script>
<script>
/* the cloud banner's state before the first paint: big (default) · small (after close) · off (after
   "don't show this again"); a signed-in cloud user (the c4_sess sign-in marker cookie on .crawl4ai.com) gets small */
(function(){try{var v=JSON.parse(localStorage.getItem("c4-cloud-banner")||"null");var s=(v&&v.version===1)?v.state:"big";
if(s==="big"&&/(^|; )c4_sess=1(;|$)/.test(document.cookie))s="small";document.documentElement.setAttribute("data-c4b",s);}
catch(e){document.documentElement.setAttribute("data-c4b","big");}})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pushfeedback/dist/pushfeedback/pushfeedback.css">

<style>
    :root {
        /* brand */
        --feedback-primary-color: #09b5a5;
        --feedback-highlight-color: #fed500;


        /* align with the value you really use in :root */
        --header-height: 65px;

        /* Push modal content down */
        --feedback-modal-content-position-top: var(--header-height);

        --feedback-modal-modal-wrapper-z-index: 1100;
        /*  >  header’s 1000 */
        --feedback-modal-content-z-index: 1101;
    }

    feedback-modal::part(overlay) {
        top: var(--header-height);
        /* start below header */
        height: calc(100vh - var(--header-height));
        /* fill the rest */


    }
</style>
<script type="module"
    src="https://cdn.jsdelivr.net/npm/pushfeedback@latest/dist/pushfeedback/pushfeedback.esm.js"></script>
{% endblock %}

{% block top_nav %}
{{ super() }}
{% include "partials/cloud-banner.html" %}
{% endblock %}

<feedback-button project="w8plzp8vjp" button-style="dark" button-position="center-right" modal-position="sidebar-right">
    >
    Feedback
</feedback-button>
{% endblock %}
